name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string
      dry_run:
        description: Build and verify without creating a tag or publishing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-apk-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release request and CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate branch, version, and CI
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Run this workflow from the default branch (%s).\n' "$DEFAULT_BRANCH" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected version MAJOR.MINOR.PATCH without a leading v; got %s\n' "$RELEASE_VERSION" >&2
            exit 1
          fi

          default_branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)"
          if [[ "$default_branch_sha" != "$GITHUB_SHA" ]]; then
            printf 'Workflow commit %s is not the current default-branch head %s\n' "$GITHUB_SHA" "$default_branch_sha" >&2
            exit 1
          fi

          if [[ "$DRY_RUN" != "true" ]]; then
            successful_ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=${DEFAULT_BRANCH}&status=completed&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push")] | length')"
            if [[ "$successful_ci" -lt 1 ]]; then
              printf 'A successful CI run for %s at %s is required before release\n' "$DEFAULT_BRANCH" "$GITHUB_SHA" >&2
              exit 1
            fi
            tag="v${RELEASE_VERSION}"
            if ! existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha // empty' 2>/dev/null)"; then
              existing_sha=""
            fi
            if [[ -n "$existing_sha" && "$existing_sha" != "$GITHUB_SHA" ]]; then
              printf 'Release tag %s already points to %s, not %s\n' "$tag" "$existing_sha" "$GITHUB_SHA" >&2
              exit 1
            fi
          fi

          printf 'sha=%s\nversion=%s\ntag=v%s\n' "$GITHUB_SHA" "$RELEASE_VERSION" "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
  build-release:
    needs: validate-release
    name: Build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android 36 SDK packages
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure release signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_SIGNING_KEYSTORE_BASE64:?Missing repository secret ANDROID_SIGNING_KEYSTORE_BASE64}"
          : "${ANDROID_SIGNING_KEYSTORE_PASSWORD:?Missing repository secret ANDROID_SIGNING_KEYSTORE_PASSWORD}"
          : "${ANDROID_SIGNING_KEY_ALIAS:?Missing repository secret ANDROID_SIGNING_KEY_ALIAS}"
          if [[ -e signing.properties ]]; then
            echo "Refusing to overwrite existing signing.properties" >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/android-signing-keystore.p12"
          properties="$RUNNER_TEMP/android-signing.properties"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export ANDROID_SIGNING_KEYSTORE_FILE="$keystore"
          export ANDROID_SIGNING_PROPERTIES_FILE="$properties"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              result = []
              for index, char in enumerate(value):
                  code = ord(char)
                  if char == "\\":
                      result.append("\\\\")
                  elif char == "\t":
                      result.append("\\t")
                  elif char == "\n":
                      result.append("\\n")
                  elif char == "\r":
                      result.append("\\r")
                  elif char == "\f":
                      result.append("\\f")
                  elif char == " " and index == 0:
                      result.append("\\ ")
                  elif 0x20 <= code <= 0x7E:
                      result.append(char)
                  elif code <= 0xFFFF:
                      result.append(f"\\u{code:04x}")
                  else:
                      code -= 0x10000
                      result.append(f"\\u{0xD800 + (code >> 10):04x}")
                      result.append(f"\\u{0xDC00 + (code & 0x3FF):04x}")
              return "".join(result)

          properties = {
              "keyAlias": os.environ["ANDROID_SIGNING_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_SIGNING_KEYSTORE_PASSWORD"],
              "storeFile": os.environ["ANDROID_SIGNING_KEYSTORE_FILE"],
              "storePassword": os.environ["ANDROID_SIGNING_KEYSTORE_PASSWORD"],
          }
          Path(os.environ["ANDROID_SIGNING_PROPERTIES_FILE"]).write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          PY
          touch "$RUNNER_TEMP/android-signing-created"
          mv "$properties" signing.properties

      - name: Run unit tests and build signed release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK version and signature
        id: apk
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          apk_version="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')"
          if [[ "$RELEASE_VERSION" != "$apk_version" ]]; then
            printf 'Requested version %s does not match APK versionName %s\n' "$RELEASE_VERSION" "$apk_version" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK for release publishing
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/android-signing-created" ]]; then
            rm -f signing.properties
          fi
          rm -f \
            "$RUNNER_TEMP/android-signing-keystore.p12" \
            "$RUNNER_TEMP/android-signing.properties" \
            "$RUNNER_TEMP/android-signing-created"

  create-tag:
    if: ${{ inputs.dry_run == false }}
    needs: [validate-release, build-release]
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create or verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha // empty' 2>/dev/null)"; then
            existing_sha=""
          fi
          if [[ -n "$existing_sha" ]]; then
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              printf 'Release tag %s already points to %s, not %s\n' "$RELEASE_TAG" "$existing_sha" "$RELEASE_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${RELEASE_SHA}" >/dev/null
          fi

  attest:
    if: ${{ inputs.dry_run == false }}
    needs: [validate-release, build-release, create-tag]
    name: Attest signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-apk
          path: dist

      - name: Locate release APK
        id: apk
        run: |
          apk="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Attest release APK provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ steps.apk.outputs.path }}

  publish:
    if: ${{ inputs.dry_run == false }}
    needs: [validate-release, build-release, create-tag, attest]
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-apk
          path: dist

      - name: Locate release APK
        id: apk
        run: |
          apk="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" "$APK_PATH" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
